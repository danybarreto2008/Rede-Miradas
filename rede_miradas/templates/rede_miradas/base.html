{% load static %}

<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Rede Miradas{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS principal -->
    <link
        rel="stylesheet"
        href="{% static 'rede_miradas/css/base.css' %}"
    >

</head>

<body>

    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">

        <div class="container-fluid px-4 px-lg-5">

            <!-- Logo -->
            <a
                class="navbar-brand d-flex align-items-center gap-2"
                href="{% url 'home' %}"
            >

                <img
                    src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
                    alt="Logo Rede Miradas"
                    height="32"
                >

                <span>
                    REDE <strong>MIRADAS</strong>
                </span>

            </a>


            <!-- Botão do menu em telas pequenas -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#menuLateral"
                aria-controls="menuLateral"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Menu em telas grandes -->
            <div class="d-none d-lg-flex align-items-center w-100">

                <!-- Links centralizados -->
                <div
                    class="position-absolute start-50 translate-middle-x d-flex align-items-center gap-4"
                >

                    <a
                        class="nav-link"
                        href="{% url 'home' %}"
                    >
                        COMECE POR AQUI
                    </a>

                    <a
                        class="nav-link"
                        href="#"
                    >
                        TRILHAS DE APRENDIZAGEM
                    </a>

                    <a
                        class="nav-link"
                        href="#"
                    >
                        NOTÍCIAS
                    </a>

                </div>


                <!-- Botão entrar -->
                <div class="ms-auto">

                    <a
                        class="btn btn-neon rounded-pill px-3"
                        href="#"
                    >

                        <i class="bi bi-box-arrow-in-right"></i>
                        ENTRAR

                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- Menu lateral -->
    <div
        class="offcanvas offcanvas-end text-bg-dark"
        tabindex="-1"
        id="menuLateral"
    >

        <div class="offcanvas-header">

            <span class="fw-bold">
                Menu
            </span>

            <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="offcanvas"
            ></button>

        </div>


        <div class="offcanvas-body d-flex flex-column gap-3">

            <a
                class="nav-link"
                href="{% url 'home' %}"
            >
                COMECE POR AQUI
            </a>

            <a
                class="nav-link"
                href="#"
            >
                TRILHAS DE APRENDIZAGEM
            </a>

            <a
                class="nav-link"
                href="#"
            >
                NOTÍCIAS
            </a>

            <a
                class="btn btn-neon rounded-pill px-3"
                href="#"
            >

                <i class="bi bi-box-arrow-in-right"></i>
                ENTRAR

            </a>

        </div>

    </div>


    <!-- Conteúdo da página -->
    <main>

        {% block conteudo %}
        {% endblock %}

    </main>


    <!-- Rodapé -->
    <footer class="text-center bg-black text-secondary py-4 mt-5">

        <div>
            &copy; 2026 Rede Miradas.
        </div>

        <div>
            Todos os direitos reservados.
        </div>

    </footer>


    <!-- JavaScript do Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
