{% load static %}

<!-- MENU LATERAL FIXO -->

<aside class="perfil-menu" aria-label="Navegação">

    <a href="{% url 'home' %}" class="perfil-menu-logo" title="Rede Miradas">
        <img
            src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
            alt="Rede Miradas"
        >
    </a>

    <nav class="perfil-menu-nav">

        <a href="{% url 'home' %}" class="perfil-menu-link">
            <span class="perfil-menu-icone"><i class="bi bi-house-door"></i></span>
            <span class="perfil-menu-nome">Início</span>
        </a>

        <a href="{% url 'inicial_trilhas' %}" class="perfil-menu-link">
            <span class="perfil-menu-icone"><i class="bi bi-mortarboard"></i></span>
            <span class="perfil-menu-nome">Trilhas</span>
        </a>

        <a href="{% url 'noticias' %}" class="perfil-menu-link">
            <span class="perfil-menu-icone"><i class="bi bi-newspaper"></i></span>
            <span class="perfil-menu-nome">Notícias</span>
        </a>

    </nav>

</aside>

<!-- Animação dos botões (igual à do botão de login) -->
<script>
(function () {

    document.querySelectorAll('a.perfil-btn[href]').forEach(function (botao) {

        botao.addEventListener('click', function (evento) {

            if (botao.target === '_blank' || evento.button !== 0 ||
                evento.ctrlKey || evento.metaKey || evento.shiftKey) {
                return;
            }

            evento.preventDefault();

            if (botao.classList.contains('animando')) {
                return;
            }

            botao.classList.add('animando');

            setTimeout(function () {
                window.location.href = botao.href;
            }, 450);
        });
    });

    /* botão "voltar" do navegador: tira a animação */
    window.addEventListener('pageshow', function () {
        document.querySelectorAll('.perfil-btn.animando').forEach(function (b) {
            b.classList.remove('animando');
        });
    });

})();
</script>
