{% extends 'rede_miradas/base.html' %}

{% block conteudo %}

<div class="container py-5 text-white text-center">

    <h2>Bem-vindo(a), {{ user.first_name }}!</h2>
    <p class="text-secondary">Este é o painel do aluno.</p>

    <a href="{% url 'meu_perfil' %}" class="btn btn-outline-light d-inline-block mt-3 me-2">Meu perfil</a>

    <form method="post" action="{% url 'account_logout' %}" class="d-inline-block mt-3">
        {% csrf_token %}
        <button type="submit" class="btn-neon">Sair</button>
    </form>

</div>

{% endblock %}
