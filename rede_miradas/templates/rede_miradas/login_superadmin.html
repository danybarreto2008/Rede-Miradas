{% extends 'rede_miradas/base.html' %}

{% block conteudo %}

<div class="container py-5" style="max-width: 420px;">

    <h2 class="text-center text-white fw-bold mb-4">Acesso restrito</h2>

    {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label text-white">Usuário ou e-mail</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label text-white">Senha</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button type="submit" class="btn-neon w-100">Entrar</button>

    </form>

</div>

{% endblock %}
