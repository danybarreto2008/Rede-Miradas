{% extends 'rede_miradas/base.html' %}

{% block conteudo %}

<div class="container py-5" style="max-width: 420px;">

    <h2 class="text-center text-white fw-bold mb-4">Entrar</h2>

    <form method="post">

        {% csrf_token %}

        {% for campo in form %}

            <div class="mb-3">
                <label class="form-label text-white">{{ campo.label }}</label>
                {{ campo }}
                {% if campo.errors %}
                    <div class="text-danger small">{{ campo.errors }}</div>
                {% endif %}
            </div>

        {% endfor %}

        <button type="submit" class="btn-neon w-100">Entrar</button>

    </form>

    <p class="text-center text-secondary mt-3">
        Não tem conta?
        <a href="{% url 'cadastro_aluno' %}" class="text-white">Cadastre-se como aluno</a>
        ou
        <a href="{% url 'cadastro_professor' %}" class="text-white">como professor</a>
    </p>

</div>

{% endblock %}
