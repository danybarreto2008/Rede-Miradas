{% load static %}

<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verifique seu e-mail | Rede Miradas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'rede_miradas/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'rede_miradas/css/login.css' %}">

</head>

<body class="pagina-autenticacao">

    <main class="autenticacao">

        <a href="{% url 'home' %}" class="logo-autenticacao">
            <img src="{% static 'rede_miradas/img/triangulomiradas.png' %}" alt="Logo Rede Miradas">
            <span>REDE <strong>MIRADAS</strong></span>
        </a>

        <section class="card-autenticacao">

            <div class="cabecalho-autenticacao">

                <i class="bi bi-envelope-check" style="font-size: 2.5rem; margin-bottom: 0.75rem; display: block;"></i>

                <span class="etiqueta-autenticacao">REDE MIRADAS</span>

                <h1>Verifique seu e-mail</h1>

                <p>
                    Enviamos um e-mail de confirmação pra você. Siga o link recebido para
                    finalizar o seu cadastro. Se não encontrar na caixa de entrada principal,
                    confira a pasta de spam.
                </p>

            </div>

        </section>

        <a href="{% url 'home' %}" class="voltar-site">
            <i class="bi bi-arrow-left"></i>
            Voltar para o site
        </a>

    </main>

</body>

</html>
