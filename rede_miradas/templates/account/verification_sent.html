{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verifique seu e-mail | Rede Miradas</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS do login -->

    <link
        rel="stylesheet"
        href="{% static 'rede_miradas/css/login-colagem.css' %}?v=3"
    >

</head>


<body class="pagina-login-split pagina-verificar-email">


    <div class="login-split">


        <!-- =====================================================
             LADO ESQUERDO — COLAGEM
             ===================================================== -->

        <div class="login-colagem">

            <img
                src="{% static 'rede_miradas/img/login/colagem.jpg' %}"
                alt="Colagem Rede Miradas"
            >

        </div>



        <!-- =====================================================
             LADO DIREITO — VERIFICAR E-MAIL
             ===================================================== -->

        <div class="login-form-lado">


            <!-- =================================================
                 TRIÂNGULOS
                 ================================================= -->

            <img
                src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
                class="triangulo-login triangulo-superior-esquerdo"
                alt=""
            >

            <img
                src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
                class="triangulo-login triangulo-superior-direito"
                alt=""
            >

            <img
                src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
                class="triangulo-login triangulo-inferior"
                alt=""
            >



            <!-- =================================================
                 CONTEÚDO
                 ================================================= -->

            <div class="login-form-conteudo">


                <!-- LOGO -->

                <a
                    href="{% url 'home' %}"
                    class="logo-login-split"
                >
                    REDE <strong>MIRADAS</strong>
                </a>



                <!-- ÍCONE -->

                <i class="bi bi-envelope-check icone-verificar-email"></i>



                <!-- TÍTULO -->

                <h1>
                    Verifique seu e-mail
                </h1>



                <!-- MENSAGEM -->

                <p class="mensagem-verificar-email">

                    Enviamos um e-mail de confirmação pra você.
                    Siga o link recebido para finalizar o seu cadastro.

                </p>


                <p class="mensagem-verificar-email mensagem-secundaria">

                    Se não encontrar na caixa de entrada principal,
                    confira a pasta de spam.

                </p>



                <!-- VOLTAR -->

                <a
                    href="{% url 'home' %}"
                    class="voltar-site"
                >

                    <i class="bi bi-arrow-left"></i>

                    Voltar para o site

                </a>


            </div>


        </div>


    </div>


</body>

</html>
