{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar login | Rede Miradas</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS do login -->

    <link
        rel="stylesheet"
        href="{% static 'rede_miradas/css/login-colagem.css' %}?v=3"
    >

</head>

<body class="pagina-login-split pagina-confirmar-login">


    <div class="login-split">


        <!-- =====================================================
             LADO ESQUERDO — COLAGEM
             ===================================================== -->

        <div class="login-colagem">

            <img
                src="{% static 'rede_miradas/img/login/colagem.jpg' %}"
                alt="Colagem Rede Miradas"
            >

        </div>



        <!-- =====================================================
             LADO DIREITO — CONFIRMAR LOGIN
             ===================================================== -->

        <div class="login-form-lado">


            <!-- =================================================
                 TRIÂNGULOS
                 ================================================= -->

            <img
                src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
                class="triangulo-login triangulo-superior-esquerdo"
                alt=""
            >

            <img
                src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
                class="triangulo-login triangulo-superior-direito"
                alt=""
            >

            <img
                src="{% static 'rede_miradas/img/triangulomiradas.png' %}"
                class="triangulo-login triangulo-inferior"
                alt=""
            >



            <!-- =================================================
                 CONTEÚDO
                 ================================================= -->

            <div class="login-form-conteudo">


                <!-- LOGO -->

                <a
                    href="{% url 'home' %}"
                    class="logo-login-split"
                >
                    REDE <strong>MIRADAS</strong>
                </a>



                <!-- TÍTULO -->

                <h1>
                    Confirmar login
                </h1>



                <!-- MENSAGEM -->

                <p class="mensagem-confirmacao-login">

                    Você está prestes a entrar usando sua conta
                    do {{ provider.name }}.

                </p>



                <!-- =================================================
                     FORMULÁRIO
                     ================================================= -->

                <form method="post">

                    {% csrf_token %}


                    <button
                        type="submit"
                        class="btn-login-split btn-confirmar-login"
                    >

                        {% if provider.id == 'suap' %}

                            <i class="bi bi-building"></i>

                        {% else %}

                            <i class="bi bi-google"></i>

                        {% endif %}


                        <span>
                            CONTINUAR COM {{ provider.name|upper }}
                        </span>

                    </button>

                </form>



                <!-- =================================================
                     VOLTAR
                     ================================================= -->

                <a
                    href="{% url 'home' %}"
                    class="voltar-site"
                >

                    <i class="bi bi-arrow-left"></i>

                    Voltar para o site

                </a>


            </div>


        </div>


    </div>


</body>

</html>
