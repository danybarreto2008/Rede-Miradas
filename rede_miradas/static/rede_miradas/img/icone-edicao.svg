<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRose1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gradRose2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
    <linearGradient id="gradCyanCut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadowRose" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowRose)" transform="translate(18, 12)">
    <!-- Monitor / Timeline Frame -->
    <rect x="15" y="15" width="94" height="64" rx="8" fill="url(#gradRose1)" stroke="#be123c" stroke-width="4" stroke-linejoin="round" />
    <rect x="22" y="22" width="80" height="50" rx="5" fill="#0f172a" />

    <!-- Monitor Stand -->
    <path d="M 54 79 L 52 94 L 72 94 L 70 79 Z" fill="#be123c" stroke="#9f1239" stroke-width="3" />
    <path d="M 40 94 L 84 94" stroke="#e11d48" stroke-width="4.5" stroke-linecap="round" />

    <!-- Video Timeline Tracks inside Monitor -->
    <!-- Track 1: Video -->
    <rect x="26" y="27" width="34" height="9" rx="3" fill="url(#gradRose2)" />
    <rect x="63" y="27" width="35" height="9" rx="3" fill="url(#gradCyanCut)" />

    <!-- Track 2: B-Roll / Overlay -->
    <rect x="36" y="39" width="42" height="9" rx="3" fill="url(#gradRose1)" opacity="0.9" />

    <!-- Track 3: Audio Waveform -->
    <rect x="26" y="51" width="72" height="15" rx="3" fill="#1e293b" />
    <path d="M 30 58 L 34 54 L 38 62 L 42 55 L 46 60 L 50 53 L 54 63 L 58 57 L 62 61 L 66 54 L 70 60 L 74 56 L 78 62 L 82 55 L 86 59 L 90 58" 
          fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Timeline Playhead (Red vertical indicator with diamond top) -->
    <polygon points="62,24 65,27 62,30 59,27" fill="#ef4444" />
    <line x1="62" y1="26" x2="62" y2="68" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cinema Scissors / Cut Accent on bottom right -->
    <g transform="translate(86, 60) rotate(-25)">
      <!-- Scissor Handles -->
      <circle cx="8" cy="18" r="6.5" fill="none" stroke="#f43f5e" stroke-width="3.5" />
      <circle cx="20" cy="18" r="6.5" fill="none" stroke="#f43f5e" stroke-width="3.5" />
      <!-- Scissor Blades -->
      <path d="M 8 12 L 20 -4" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 20 12 L 8 -4" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <!-- Joint pin -->
      <circle cx="14" cy="4" r="2" fill="#be123c" />
    </g>
  </g>
</svg>
