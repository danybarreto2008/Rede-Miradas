<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradOrange1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7849" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="gradOrange2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="shadowOrange" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadowOrange)" transform="translate(10, 5)">
    <!-- Left Sleeve / Arm -->
    <path d="M 10 35 L 35 15 C 38 13 43 14 46 17 L 60 32 C 63 35 63 40 60 43 L 38 65 C 35 68 30 68 27 65 L 10 48 C 7 45 7 40 10 35 Z" 
          fill="url(#gradOrange2)" stroke="#ea580c" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Right Sleeve / Arm -->
    <path d="M 130 35 L 105 15 C 102 13 97 14 94 17 L 80 32 C 77 35 77 40 80 43 L 102 65 C 105 68 110 68 113 65 L 130 48 C 133 45 133 40 130 35 Z" 
          fill="url(#gradOrange2)" stroke="#ea580c" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Clasping Center / Handshake Fingers -->
    <!-- Left Hand Thumb and Palm -->
    <path d="M 46 36 C 52 28 62 25 72 32 L 88 44 C 92 47 92 52 88 55 L 75 66 C 71 69 66 69 62 65 L 46 48 Z" 
          fill="url(#gradOrange1)" stroke="#ea580c" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Fingers detail interlocked -->
    <!-- Finger 1 -->
    <path d="M 52 56 C 54 62 60 66 67 65 L 82 54 C 85 52 85 48 82 46 L 72 40" 
          fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />
    
    <!-- Finger 2 -->
    <path d="M 45 64 C 48 70 55 74 62 72 L 75 62 C 78 60 78 56 75 54" 
          fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />

    <!-- Finger 3 -->
    <path d="M 39 71 C 42 77 49 81 56 79 L 68 69" 
          fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />

    <!-- Finger 4 -->
    <path d="M 34 78 C 37 83 43 86 50 84 L 58 77" 
          fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" />

    <!-- Inner wrist accent lines -->
    <path d="M 22 25 L 32 35" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 118 25 L 108 35" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
