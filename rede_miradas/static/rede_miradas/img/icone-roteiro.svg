<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="gradEraser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadowBlue" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadowBlue)" transform="translate(25, 5)">
    <!-- Main Angled Pencil Body -->
    <!-- Metal band / collar under eraser -->
    <path d="M 68 12 L 82 22 L 76 28 L 62 18 Z" 
          fill="#94a3b8" stroke="#0284c7" stroke-width="3" stroke-linejoin="round" />

    <!-- Eraser top -->
    <path d="M 68 12 C 72 7 82 7 88 12 C 93 16 90 24 82 22 Z" 
          fill="url(#gradEraser)" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" />

    <!-- Body Facet 1 (Left / Darker) -->
    <path d="M 62 18 L 70 24 L 38 78 L 30 72 Z" 
          fill="url(#gradBlue1)" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" />

    <!-- Body Facet 2 (Middle / Lighter) -->
    <path d="M 70 24 L 78 30 L 46 84 L 38 78 Z" 
          fill="url(#gradBlue2)" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" />

    <!-- Body Facet 3 (Right) -->
    <path d="M 78 30 L 84 35 L 52 89 L 46 84 Z" 
          fill="url(#gradBlue1)" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" />

    <!-- Wood Tip -->
    <path d="M 30 72 L 52 89 L 26 98 Z" 
          fill="#ffedd5" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" />

    <!-- Graphite Lead Tip -->
    <path d="M 26 98 L 32 94 L 35 97 Z" 
          fill="#0f172a" stroke="#0f172a" stroke-width="3" stroke-linejoin="round" />

    <!-- Decorative writing lines/swirl under pencil -->
    <path d="M 22 102 C 14 105 10 108 16 111 C 24 114 36 108 48 106 C 58 104 65 107 72 106" 
          fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.65" />
  </g>
</svg>
