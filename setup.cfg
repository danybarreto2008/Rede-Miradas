[pycodestyle]
max-line-length = 120
ignore = E501,E203,W503
exclude = venv,.git,__pycache__,migrations,rede_miradas/management/commands/popular_trilhas.py

[flake8]
max-line-length = 120
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    venv,
    */migrations/*,
    rede_miradas/management/commands/popular_trilhas.py,
    build,
    dist
